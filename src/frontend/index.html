<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Nib</title>
<link rel="stylesheet" href="palette.css">
<style>
  /* The Welcome window — the app's one fixed window ('main'). Closing it
     hides it (setHideOnClose); it comes back via Window ▸ Welcome, or on its
     own when the last document window closes. */

  * { box-sizing: border-box; margin: 0; padding: 0; }

  /* The palette is palette.css, linked above — one definition per appearance,
     shared by every window. This page used to carry a subset of its own, which
     meant changing --accent was four edits in four files. */


  html, body { height: 100%; overflow: hidden; }
  body {
    display: flex; flex-direction: column;
    background: var(--bg); color: var(--fg);
    font: 13px -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-user-select: none; user-select: none;
  }
  body.dropping { outline: 3px solid var(--accent); outline-offset: -3px; }

  /* The one-time Introduction banner. Dismissing it swaps in a line saying
     where the window lives, then the whole bar fades out — and never returns. */
  #introBar {
    flex: none; display: flex; align-items: center; gap: 10px;
    padding: 8px 14px; font-size: 12px;
    background: color-mix(in srgb, var(--accent) 12%, var(--bg));
    border-bottom: 1px solid color-mix(in srgb, var(--accent) 30%, var(--line));
    transition: opacity .6s;
  }
  #introBar .flex { flex: 1; }
  #introBar b { font-weight: 600; }
  #introBar button {
    font: 11.5px -apple-system, sans-serif; border-radius: 6px; padding: 4px 12px;
    background: var(--accent); border: none; color: #fff;
  }
  #introBar #introX {
    background: none; color: var(--dim); font-size: 12px; padding: 4px 6px;
  }
  #introBar #introX:hover { color: var(--fg); }
  #introBar.bye { justify-content: center; color: var(--dim); }

  #hero { text-align: center; padding: 26px 20px 18px; flex: none; }
  #hero svg { width: 44px; height: 44px; }
  #hero h1 { font-size: 21px; font-weight: 650; margin-top: 6px; }
  #hero p { font-size: 12px; color: var(--dim); margin-top: 3px; }

  /* The window resizes now, so both rows have to survive a narrow one (the
     buttons wrap) and a wide one (the lists stop short of a silly line). */
  #actions {
    display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;
    padding: 0 16px 16px; flex: none;
  }
  #actions button {
    font: 12.5px -apple-system, sans-serif; font-weight: 500;
    border: 1px solid var(--line); border-radius: 8px;
    background: var(--panel); color: var(--fg);
    padding: 7px 16px;
  }
  #actions button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  #actions button span { opacity: .55; font-weight: 400; margin-left: 6px; font-size: 11px; }

  #draftCard {
    /* same column as the lists below it, whatever the window's width */
    width: calc(100% - 36px); max-width: 684px; margin: 0 auto 12px;
    padding: 10px 14px; flex: none;
    display: flex; align-items: center; gap: 10px;
    background: var(--panel); border: 1px solid var(--accent); border-radius: 10px;
    font-size: 12px;
  }
  #draftCard b { font-weight: 600; }
  #draftCard .flex { flex: 1; }
  #draftCard button {
    font: 11.5px -apple-system, sans-serif; color: #fff;
    background: var(--accent); border: none; border-radius: 6px; padding: 4px 12px;
  }

  #recents { flex: 1; overflow-y: auto; padding: 0 18px 16px; width: 100%; max-width: 720px; margin: 0 auto; }
  #recents h2 {
    font-size: 11px; font-weight: 600; color: var(--dim);
    text-transform: uppercase; letter-spacing: .05em; margin: 4px 2px 8px;
  }
  .recent {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 10px; border-radius: 8px; cursor: default;
  }
  .recent:hover { background: var(--panel); }
  .recent .icon { font-size: 17px; }
  .recent .names { flex: 1; min-width: 0; }
  .recent .name { font-size: 12.5px; font-weight: 500; }
  .recent .dir {
    font-size: 11px; color: var(--dim);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .recent .x { color: var(--dim); font-size: 12px; padding: 4px 6px; visibility: hidden; }
  .recent:hover .x { visibility: visible; }
  .recent.gone { opacity: .45; }
  .recent.gone .name::after { content: "  (moved or deleted)"; font-weight: 400; color: var(--dim); }
  /* the folder that is open right now, so reopening it isn't a mystery */
  .recent .open {
    font-size: 10px; font-weight: 600; color: #fff; background: var(--accent);
    border-radius: 5px; padding: 2px 6px; text-transform: uppercase; letter-spacing: .04em;
  }
  #recents h2 + .recent { margin-top: -2px; }
  #recents .gap { height: 14px; }

  #empty { text-align: center; color: var(--dim); font-size: 12px; padding: 26px 0; }

  #cliLine { flex: none; text-align: center; padding: 6px 0 12px; font-size: 11px; }
  #cliLine a { color: var(--dim); cursor: default; }
  #cliLine a:hover { color: var(--accent); text-decoration: underline; }
</style>
</head>
<body>

<div id="introBar" hidden>
  <span class="flex">New here? The <b>Introduction to Nib</b> says what it’s for —
  documentation folders, linking, pinning, the editable preview.</span>
  <button id="introOpen">Read it</button>
  <button id="introX" title="Dismiss — it stays in the Help menu">✕</button>
</div>

<div id="hero">
  <svg viewBox="0 0 48 48" fill="none">
    <path d="M24 45 C17 36 10 27.5 10 18.5 A14 13.5 0 0 1 38 18.5 C38 27.5 31 36 24 45 Z"
          fill="var(--accent)" opacity=".92"/>
    <path d="M24 41 L24 25" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="24" cy="20.5" r="2.6" fill="#fff"/>
  </svg>
  <h1>Nib</h1>
  <p>A tiny Markdown editor — drop a .md file anywhere in this window</p>
</div>

<div id="actions">
  <button id="btnNew" class="primary">New Document<span>⌘N</span></button>
  <button id="btnOpen">Open…<span>⌘O</span></button>
  <button id="btnFolder" title="Open a folder as a project — its files appear in every document window">Open Folder…<span>⌘⇧F</span></button>
  <button id="btnExample" title="A document showing everything Nib renders">Example</button>
</div>

<div id="draftCard" hidden>
  <span>📝</span>
  <span><b>Unsaved draft</b> from a closed untitled window</span>
  <span class="flex"></span>
  <button id="btnDraft">Restore</button>
</div>

<div id="recents"></div>

<!-- Windows and Linux run without a menu bar, so the terminal command needs a
     door somewhere visible; on macOS it doubles the File menu item. -->
<div id="cliLine"><a id="btnCli">Install the nib terminal command…</a></div>

<script type="module" src="./welcome.ts"></script>
</body>
</html>
