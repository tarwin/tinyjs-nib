<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Settings</title>
<link rel="stylesheet" href="palette.css">
<link rel="stylesheet" href="doc.css">
</head>
<body class="setwin">

<!-- Settings is its own window rather than a sheet: it has to open from the
     Welcome screen and from no window at all, and hanging it off a document
     meant conjuring an empty one to hold it. -->
<div id="setSheet" role="dialog">
  <header id="setHead">
    <!-- Which LAYER you are editing. Mine is always there; the other two
         appear with a folder, because that is what they are about. -->
    <div id="setTabs"></div>
    <span class="flex"></span>
    <span id="setScope"></span>
  </header>
  <div id="setBody">
    <nav id="setSide"></nav>
    <div id="setPane"></div>
  </div>
  <footer id="setFoot"><span id="setNote"></span></footer>
</div>

<div id="toast" hidden></div>

<script type="module" src="./settings-page.ts"></script>
</body>
</html>
